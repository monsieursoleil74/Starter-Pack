name: Build Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'pptx2html-tool/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyinstaller python-pptx tkinterdnd2 pymupdf

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PPTX2HTML --collect-all tkinterdnd2 --collect-all pymupdf pptx2html-tool/PPTX2HTML_Tool.py

      - name: Assemble zips
        run: |
          # zip exe (PyMuPDF embarqué, plus besoin de Poppler)
          $out = "PPTX2HTML"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item dist/PPTX2HTML.exe "$out/"
          Copy-Item pptx2html-tool/LISEZMOI.txt "$out/"
          Compress-Archive -Path $out -DestinationPath PPTX2HTML-Windows.zip

          # zip sans exe ni .bat (compatible Smart App Control) :
          # un .pyw à double-cliquer, qui s'auto-installe au 1er lancement
          $src = "PPTX2HTML-SansExe"
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          Copy-Item pptx2html-tool/PPTX2HTML_Tool.py "$src/PPTX2HTML.pyw"
          Copy-Item pptx2html-tool/LISEZMOI_SANS_EXE.txt "$src/LISEZMOI.txt"
          Compress-Archive -Path $src -DestinationPath PPTX2HTML-Windows-SansExe.zip

          Get-ChildItem *.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: PPTX2HTML pour Windows
          body: |
            Deux versions au choix — dans les deux cas : dézipper, lancer, **déposer le `.pptx`** (export Google Slides), c'est tout.

            - **`PPTX2HTML-Windows.zip`** — l'exe tout-en-un. Au premier lancement, SmartScreen peut demander « Informations complémentaires → Exécuter quand même ».
            - **`PPTX2HTML-Windows-SansExe.zip`** — pour les PC où **Smart App Control** bloque les exe et les .bat non signés : aucun des deux dedans. Installe Python ([Microsoft Store](https://apps.microsoft.com/search?query=python)) + LibreOffice, puis double-clique `PPTX2HTML.pyw` — il installe ses composants tout seul au premier lancement. Voir le LISEZMOI inclus.

            Dans les deux cas, LibreOffice est requis (installation unique, signée) : https://fr.libreoffice.org — un bouton dans l'app t'y amène s'il manque.
            100 % hors ligne : aucun contenu ne quitte la machine.

            Ces zips sont reconstruits automatiquement à chaque mise à jour de l'outil.
          files: |
            PPTX2HTML-Windows.zip
            PPTX2HTML-Windows-SansExe.zip
