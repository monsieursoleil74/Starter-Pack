name: Build Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'pptx2html-tool/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyinstaller python-pptx tkinterdnd2

      - name: Download Poppler (bundled next to the exe)
        run: |
          curl.exe -L -o poppler.zip https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip
          Expand-Archive poppler.zip -DestinationPath poppler-x

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PPTX2HTML --collect-all tkinterdnd2 pptx2html-tool/PPTX2HTML_Tool.py

      - name: Assemble zip
        run: |
          $out = "PPTX2HTML"
          New-Item -ItemType Directory -Path "$out/poppler" -Force | Out-Null
          Copy-Item dist/PPTX2HTML.exe "$out/"
          $bin = Get-ChildItem poppler-x -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          Copy-Item "$($bin.DirectoryName)/pdftoppm.exe" "$out/poppler/"
          Copy-Item "$($bin.DirectoryName)/*.dll" "$out/poppler/"
          Copy-Item pptx2html-tool/LISEZMOI.txt "$out/"
          Compress-Archive -Path $out -DestinationPath PPTX2HTML-Windows.zip
          Get-Item PPTX2HTML-Windows.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: PPTX2HTML pour Windows
          body: |
            **Télécharge `PPTX2HTML-Windows.zip` ci-dessous**, dézippe-le, ouvre `PPTX2HTML.exe` et dépose ton fichier `.pptx` (export Google Slides).

            - Poppler est inclus dans le zip — rien à installer de ce côté.
            - LibreOffice est requis (installation unique) : https://fr.libreoffice.org — un bouton dans l'app t'y amène s'il manque.
            - 100 % hors ligne : aucun contenu ne quitte la machine.

            Ce zip est reconstruit automatiquement à chaque mise à jour de l'outil.
          files: PPTX2HTML-Windows.zip
