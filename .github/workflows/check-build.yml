name: Convertisseur.html à jour

# Convertisseur.html est un fichier assemblé (src/ + vendor/) et versionné,
# pour qu'il soit téléchargeable directement. Ce job vérifie qu'il correspond
# bien à ses sources — sinon : python3 slides2html/build.py

on:
  push:
    paths:
      - 'slides2html/**'
      - '.github/workflows/check-build.yml'
  pull_request:
    paths:
      - 'slides2html/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 slides2html/build.py --check
