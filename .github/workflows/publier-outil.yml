name: Publier l'outil

# Publie htmledit/Editeur-HTML.html comme fichier téléchargeable, sur une
# release au tag fixe « outil ». Le lien ci-dessous ne change donc jamais et
# télécharge toujours la dernière version :
#   https://github.com/monsieursoleil74/Starter-Pack/releases/download/outil/Editeur-HTML.html

on:
  push:
    branches:
      - claude/git-github-publish-5u5ayq   # branche par défaut du dépôt
    paths:
      - 'htmledit/Editeur-HTML.html'
      - '.github/workflows/publier-outil.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ménage des anciennes versions (convertisseur de slides, .exe Windows).
      # Sans effet une fois fait : le workflow reste propre à relancer.
      - name: Retirer ce qui ne sert plus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exe-latest --yes --cleanup-tag || true
          gh release delete-asset outil Convertisseur.html --yes || true

      - name: Publier la release « outil »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="**Editeur-HTML.html** — remplace les textes, les images, les vidéos et les liens d'une maquette HTML que tu as déjà, sans toucher au code.

          Rien à installer : c'est une page web qu'on ouvre en double-cliquant. Tout se passe dans le navigateur, aucun fichier n'est envoyé en ligne.

          [Mode d'emploi](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/htmledit/README.md)

          Version publiée depuis le commit ${{ github.sha }}."
          if gh release view outil >/dev/null 2>&1; then
            gh release edit outil --title "L'éditeur — dernière version" --notes "$NOTES" --latest
            gh release upload outil htmledit/Editeur-HTML.html --clobber
          else
            gh release create outil htmledit/Editeur-HTML.html \
              --title "L'éditeur — dernière version" \
              --notes "$NOTES" --latest
          fi
